  .rr-ledger-hash { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

  .rr-status-broken { background: rgba(226,104,90,0.15); color: var(--denied); }

  .rr-footer { color: var(--text-dim); font-size: 12px; margin-top: 48px; }
  p { color: var(--text-dim); font-size: 14px; max-width: 62ch; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }

/* ============================================================

function formatNumber(value, key) {
  if (FLOAT_FIELDS.has(key) && Number.isInteger(value)) return value.toFixed(1);
  return String(value);
}
function canonicalJson(value, key) {
  if (value === null || value === undefined) return "null";
  if (typeof value === "boolean") return value ? "true" : "false";

  if (typeof value === "string") return JSON.stringify(value);
  if (Array.isArray(value)) return "[" + value.map((v) => canonicalJson(v)).join(",") + "]";
  if (typeof value === "object") {
    const keys = Object.keys(value).sort();

  }

}
function sha256Hex(str) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }

    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,

        <details>
          <summary>raw payload (edit to test tamper detection)</summary>
          <textarea class="rr-payload-edit${tampered ? " tampered" : ""}" data-case="${caseIndex}" data-event="${i}" spellcheck="false">${esc(caseState.editedPayloads[i])}</textarea>
          <div class="rr-ledger-hash">stored hash: ${event.event_hash.slice(0,24)}…</div>
        </details>
        ${result ? statusPillHTML(result.status) : ""}
      </div>
    </div>`;
  }).join("");

  const notStarted = caseState.revealed === 0 && !caseState.running;
  const inProgress = caseState.running;
  const done = caseState.revealed === caseData.events.length && !caseState.running;

  let controlsHTML;
  if (notStarted) {
    controlsHTML = `<button class="rr-btn rr-run-btn" data-run="${caseIndex}">▶ Run recovery</button>`;
  } else if (inProgress) {
    const nextType = caseData.events[caseState.revealed] ? caseData.events[caseState.revealed].event_type : "";
    controlsHTML = `<div class="rr-processing"><span class="rr-processing-dot"></span>processing: ${nextType.replace(/_/g," ")}…</div>`;
  } else {
    controlsHTML = `<div style="display:flex;gap:10px;margin-top:12px">
      <button class="rr-btn" data-verify="${caseIndex}">Verify chain</button>
      <button class="rr-btn secondary" data-reset="${caseIndex}">Restore original</button>
      <button class="rr-btn secondary" data-run="${caseIndex}">Replay</button>
    </div>`;
  }

  return `<div class="rr-case">
    <span class="rr-case-badge" style="background:var(${caseData.badgeVar})">${caseData.badgeLabel}</span>
    <h2>${esc(caseData.title)}</h2>
    <p><span class="rr-mono">${caseData.transactionId}</span> — ${esc(caseData.narrative)}</p>
    ${eventsHTML}
    ${controlsHTML}
  </div>`;
}

function render() {
  const active = DATA.batch[state.mode];
  const casesHTML = DATA.cases.map((c, i) => caseHTML(c, state.cases[i], i)).join("");

  document.getElementById("root").innerHTML = `
    <section class="rr-section">
      <div class="rr-eyebrow">RazRevRec · synthetic holdout batch of ${DATA.batch.transactions.toLocaleString("en-IN")} transactions</div>
      <div class="rr-serif rr-hero-number">${fmtINR(DATA.batch.net_lift)} recovered above baseline</div>
      <div class="rr-hero-rule"></div>
      <p>Against a retry-only baseline, RazRevRec recovers ${fmtINR(DATA.batch.net_lift)} more — net of every intervention's cost —
      on the same ${DATA.batch.transactions.toLocaleString("en-IN")}-transaction batch. We report at-risk and recovered amounts only;
      a modeled "recoverable ceiling" would need assumptions this pipeline doesn't compute yet, so it's left out rather than estimated.</p>
      <div class="rr-trust-badge"><span class="rr-trust-dot"></span>${DATA.auditSummary.totalEvents.toLocaleString("en-IN")} audit events, full chain integrity verified</div>
      <div class="rr-toggle">
        <button class="${state.mode==="razrevrec"?"active":""}" data-mode="razrevrec">RazRevRec</button>
        <button class="${state.mode==="baseline"?"active":""}" data-mode="baseline">Retry-only baseline</button>
      </div>
      <div>
        <div class="rr-compare-row"><span class="rr-compare-label">Revenue at risk</span><span class="rr-compare-value">${fmtINR2(DATA.batch.at_risk_amount)}</span></div>
        <div class="rr-compare-row"><span class="rr-compare-label">Net recovered</span><span class="rr-compare-value">${fmtINR2(active.net_recovered_value)}</span></div>
        <div class="rr-compare-row"><span class="rr-compare-label">Customer contacts</span><span class="rr-compare-value">${active.customer_contacts.toLocaleString("en-IN")}</span></div>
        <div class="rr-compare-row"><span class="rr-compare-label">Actions executed</span><span class="rr-compare-value">${active.approved_actions.toLocaleString("en-IN")} of ${DATA.batch.transactions.toLocaleString("en-IN")}</span></div>
      </div>
    </section>

    <section class="rr-section">
      <h2>Why 66% of proposals get blocked, not executed</h2>
      <p>Every one of ${DATA.batch.transactions.toLocaleString("en-IN")} transactions passes through an independent Policy Guard before anything executes.
      Here's exactly why the ${state.mode==="razrevrec"?"RazRevRec":"baseline"} run blocked ${active.guard_overrides.toLocaleString("en-IN")} proposals.</p>
      ${funnelHTML(active.guard_denial_reasons, active.approved_actions)}
    </section>

    <section class="rr-section">
      <h2>Is the confidence score honest?</h2>
      <p>Measured only on the ${DATA.calibration.evaluated_predictions} cases actually executed — a model that just guessed 50% for everyone
      would score exactly 0.25 on Brier score, always. RazRevRec scores ${DATA.calibration.brier_score.toFixed(3)}.</p>
      ${reliabilitySVG(DATA.calibration.bins)}
      ${brierHTML(DATA.calibration.brier_score, DATA.calibration.naive_constant_brier)}
    </section>

    <section class="rr-section">
      <h2>Two real transactions, not just aggregates</h2>
      <p>Edit any payload below and re-verify — the hash chain will catch it. This is real SHA-256, computed in your browser, checked against these actual recorded hashes.</p>
      ${casesHTML}
    </section>

    <div class="rr-footer">Batch seed 20260827 · synthetic holdout data · every figure above is reproducible by running
      <span class="rr-mono">python -m src.demo --transactions 2000 --seed 20260827</span> against the actual repo.</div>
  `;

  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.onclick = () => { state.mode = btn.dataset.mode; render(); };
  });
  document.querySelectorAll("textarea[data-case]").forEach((ta) => {
    ta.oninput = () => {
      const ci = +ta.dataset.case, ei = +ta.dataset.event;
      state.cases[ci].editedPayloads[ei] = ta.value;
      state.cases[ci].verifyResult = null;
      render();
      // restore focus + cursor since render() rebuilds the DOM
      const newTa = document.querySelector(`textarea[data-case="${ci}"][data-event="${ei}"]`);
      if (newTa) { newTa.focus(); newTa.setSelectionRange(ta.selectionStart, ta.selectionEnd); }
    };
  });
  document.querySelectorAll("[data-verify]").forEach((btn) => {
    btn.onclick = () => {
      const ci = +btn.dataset.verify;
      const caseData = DATA.cases[ci];
      const caseState = state.cases[ci];
      let runningPreviousHash = caseData.events[0].previous_hash;
      let broken = false;
      const results = [];
      for (let i = 0; i < caseData.events.length; i++) {
        const original = caseData.events[i];
        if (broken) { results.push({sequence: original.sequence, status: "unverified"}); continue; }
        if (original.previous_hash !== runningPreviousHash) { broken = true; results.push({sequence: original.sequence, status: "broken-link"}); continue; }
        let payload, payloadValid = true;
        try { payload = JSON.parse(caseState.editedPayloads[i]); } catch { payload = original.payload; payloadValid = false; }
        const recomputed = payloadValid ? recomputeEventHash({...original, payload}) : null;
        if (!payloadValid || recomputed !== original.event_hash) { broken = true; results.push({sequence: original.sequence, status: "broken-hash"}); continue; }
        results.push({sequence: original.sequence, status: "ok"});
        runningPreviousHash = original.event_hash;
      }
      caseState.verifyResult = results;
      render();
    };
  });
  document.querySelectorAll("[data-reset]").forEach((btn) => {
    btn.onclick = () => {
      const ci = +btn.dataset.reset;
      state.cases[ci].editedPayloads = DATA.cases[ci].events.map((e) => JSON.stringify(e.payload, Object.keys(e.payload).sort(), 2));
      state.cases[ci].verifyResult = null;
      render();
    };
  });
  document.querySelectorAll("[data-run]").forEach((btn) => {
    btn.onclick = () => {
      const ci = +btn.dataset.run;
      const caseState = state.cases[ci];
      if (caseState.running) return;
      caseState.running = true;
      caseState.revealed = 0;
      caseState.verifyResult = null;
      render();
      const totalEvents = DATA.cases[ci].events.length;
      const revealNext = () => {
        caseState.revealed += 1;
        if (caseState.revealed >= totalEvents) {
          caseState.running = false;
          render();
        } else {
          render();
          setTimeout(revealNext, 550);
        }
      };
      setTimeout(revealNext, 400);
    };
  });
}

render();
</script>
</body>
</html>
